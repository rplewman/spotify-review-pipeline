# Code-side term lists (keywords-v1). Lowercase; matched case-insensitively on word boundaries.
# topic_terms: used by the extractor to pick the evidence-quote sentence that supports the chosen topic.
# entity_terms: explicit feature/surface/third-party terms copied into `entities` when written in the text.
