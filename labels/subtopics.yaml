# Code-side subtopics for A9 grouping (subtopics-v1). issue_id = "<topic>-<subtopic>"; a complaint/cancellation record
# goes to the FIRST subtopic (in this order) with a term in its review text (case-insensitive whole word or phrase,
# the same matcher as keywords-v1), else "<topic>-general". One issue per review (allow_multi_issue: false).
# Changing this file changes issue membership: bump the version and rerun group → rank → memo.
