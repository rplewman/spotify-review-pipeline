services:
  - type: web
    name: spotify-review-pipeline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Read-only role dashboard_ro (SELECT on dashboard.* views only). Value = DASHBOARD_DATABASE_URL from .env.
      - key: DASHBOARD_DATABASE_URL
        sync: false
